<div id="slaDetailModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="sla-detail-title" role="dialog"
    aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeSlaDetail()"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
        <div
            class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl w-full">
            <div class="bg-white px-6 pt-5 pb-3 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-gray-900" id="sla-detail-title">Auditoría de SLA</h3>
                    <button onclick="closeSlaDetail()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                </div>
                <div id="slaTabs" class="flex gap-2 mt-3">
                    <button data-scope="global" onclick="openSlaDetail('global')"
                        class="sla-tab px-4 py-1.5 rounded text-sm font-medium bg-blue-900 text-white">Global</button>
                    <button data-scope="rs" onclick="openSlaDetail('rs')"
                        class="sla-tab px-4 py-1.5 rounded text-sm font-medium bg-gray-100 text-gray-700">R&amp;S</button>
                    <button data-scope="area" onclick="openSlaDetail('area')"
                        class="sla-tab px-4 py-1.5 rounded text-sm font-medium bg-gray-100 text-gray-700">Área</button>
                </div>
            </div>
            <div id="slaDetailContent" class="px-6 py-4 max-h-[60vh] overflow-y-auto text-sm"></div>
        </div>
    </div>
</div>
