<div id="addStageModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog"
    aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeAddStageModal()"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
        <div
            class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="addStageModalTitle">Agregar Etapa a la Vacante</h3>
                <form id="addStageForm" class="mt-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre de la Etapa</label>
                        <input type="text" name="name" id="addStageName" required
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm border p-2">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">SLA (Días)</label>
                            <input type="number" name="sla_days" id="addStageSla" required min="1" value="3"
                                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Rol Genérico</label>
                            <select name="owner" id="addStageOwner"
                                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm border p-2 bg-white">
                                <option value="reclutador">Reclutador</option>
                                <option value="area">Área Solicitante</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Asignar a Persona (Opcional)</label>
                        <select name="responsible_id" id="addStageResponsible"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm border p-2 bg-white">
                            <option value="">-- Usar Rol Genérico --</option>
                            {% for sede_group in users|groupby('sede_name') %}
                                {% for area_group in sede_group.list|groupby('area_name') %}
                                    <optgroup label="{{ sede_group.grouper }} - {{ area_group.grouper }}">
                                        {% for user in area_group.list %}
                                            <option value="{{ user.id }}">{{ user.full_name }}</option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Insertar en Posición</label>
                        <select name="order_index" id="addStagePosition"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm border p-2 bg-white">
                            <option value="">-- Al final del flujo --</option>
                            <option value="0">Al inicio (posición 1)</option>
                            {% for stage in vacancy.stages %}
                            <option value="{{ stage.order_index + 1 }}">Después de "{{ stage.name }}" (posición {{ stage.order_index + 2 }})</option>
                            {% endfor %}
                        </select>
                        <p class="text-xs text-gray-400 mt-1">Las etapas siguientes se reordenarán y sus fechas se recalcularán.</p>
                    </div>
                </form>
            </div>
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                <button type="button" id="btnSaveAddStage"
                    class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-900 text-base font-medium text-white hover:bg-blue-800 sm:ml-3 sm:w-auto sm:text-sm">Agregar
                    Etapa</button>
                <button type="button" onclick="closeAddStageModal()"
                    class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancelar</button>
            </div>
        </div>
    </div>
</div>
