<script>
    /**
     * GRÁFICO: Cuellos de Botella (Embudo)
     * Dibuja un embudo real sobre canvas: el ancho de cada nivel es
     * proporcional a los días promedio de la etapa y el color indica si
     * supera el SLA objetivo (rojo = cuello de botella, verde = dentro).
     */
    let bottleneckReportData = [];
    let lastBottleneckData = null;

    function bottleneckColor(real, target) {
        if (target == null || target === 0) return '#3B82F6';
        return real > target ? '#EF4444' : '#10B981';
    }

    window.renderBottleneckChart = (data) => {
        lastBottleneckData = data;
        const canvas = document.getElementById('chartBottleneck');
        if (!canvas) return;

        const labels = (data && data.labels) || [];
        const real = (data && data.real) || [];
        const target = (data && data.target) || [];

        const dpr = window.devicePixelRatio || 1;
        const container = canvas.parentElement;
        const cssWidth = container ? container.clientWidth : 800;

        if (!labels.length) {
            canvas.width = Math.round(cssWidth * dpr);
            canvas.height = Math.round(120 * dpr);
            canvas.style.width = cssWidth + 'px';
            canvas.style.height = '120px';
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssWidth, 120);
            ctx.fillStyle = '#9CA3AF';
            ctx.font = 'italic 13px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('No hay datos para el filtro seleccionado.', cssWidth / 2, 60);
            renderLegend(false);
            return;
        }

        const segmentHeight = 56;
        const topPad = 14;
        const bottomPad = 14;
        const cssHeight = labels.length * segmentHeight + topPad + bottomPad;

        canvas.style.width = cssWidth + 'px';
        canvas.style.height = cssHeight + 'px';
        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);

        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssWidth, cssHeight);

        const maxV = Math.max(...real.map(Number), 1);
        const scale = (cssWidth * 0.86) / maxV;
        const cx = cssWidth / 2;

        ctx.textBaseline = 'middle';

        for (let i = 0; i < labels.length; i++) {
            const vTop = Number(real[i]) || 0;
            const vBottom = (i < labels.length - 1) ? (Number(real[i + 1]) || 0) : (vTop * 0.3);
            const topHalf = Math.max((vTop * scale) / 2, 4);
            const bottomHalf = Math.max((vBottom * scale) / 2, 2);

            const y0 = topPad + i * segmentHeight;
            const y1 = y0 + segmentHeight - 3;
            const midY = (y0 + y1) / 2;

            const color = bottleneckColor(vTop, target[i]);

            // Trapecio del nivel
            ctx.beginPath();
            ctx.moveTo(cx - topHalf, y0);
            ctx.lineTo(cx + topHalf, y0);
            ctx.lineTo(cx + bottomHalf, y1);
            ctx.lineTo(cx - bottomHalf, y1);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            ctx.stroke();

            const owner = (data.owner && data.owner[i]) || '';
            const slaTxt = (target[i] != null && target[i] !== 0) ? `SLA ${target[i]} d` : 'sin SLA';
            const mainTxt = labels[i];
            const subTxt = owner ? `[${owner}] ${vTop} d promedio · ${slaTxt}` : `${vTop} d promedio · ${slaTxt}`;

            ctx.font = 'bold 13px Inter, sans-serif';
            const mainW = ctx.measureText(mainTxt).width;
            ctx.font = '11px Inter, sans-serif';
            const subW = ctx.measureText(subTxt).width;
            const needW = Math.max(mainW, subW);

            if (topHalf * 2 >= needW + 24) {
                // Etiqueta centrada dentro del trapecio
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Inter, sans-serif';
                ctx.fillText(mainTxt, cx, midY - 8);
                ctx.font = '11px Inter, sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.fillText(subTxt, cx, midY + 9);
            } else {
                // Etiqueta a la derecha, siempre legible
                ctx.textAlign = 'left';
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.fillStyle = '#374151';
                ctx.fillText(mainTxt, cx + topHalf + 12, midY - 8);
                ctx.font = '11px Inter, sans-serif';
                ctx.fillStyle = '#6B7280';
                ctx.fillText(subTxt, cx + topHalf + 12, midY + 8);
            }
        }

        renderLegend(true);
    };

    function renderLegend(hasData) {
        const el = document.getElementById('bottleneckLegend');
        if (!el) return;
        if (!hasData) {
            el.innerHTML = '';
            return;
        }
        el.innerHTML = `
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm" style="background:#EF4444"></span> Supera el SLA (cuello de botella)</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm" style="background:#10B981"></span> Dentro del SLA</span>
            <span class="text-gray-400">Ancho = días promedio</span>
        `;
    }

    window.renderBottleneckReport = (data) => {
        bottleneckReportData = data || [];
        const body = document.getElementById('bottleneckReportBody');
        if (!body) return;

        if (!bottleneckReportData.length) {
            body.innerHTML = '<tr><td colspan="8" class="px-4 py-6 text-center text-gray-400">No hay datos para el filtro seleccionado.</td></tr>';
            return;
        }

        body.innerHTML = bottleneckReportData.map((r) => {
            const pctColor = r.compliance_pct >= 90
                ? 'text-green-600'
                : (r.compliance_pct >= 70 ? 'text-amber-600' : 'text-red-600');
            const ownerBadge = r.owner === 'R&S'
                ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-700">R&amp;S</span>'
                : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-700">Área</span>';
            return `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-medium text-gray-800">${escapeHtml(r.stage)}</td>
                    <td class="px-4 py-2.5 text-center">${ownerBadge}</td>
                    <td class="px-4 py-2.5 text-center">${r.count}</td>
                    <td class="px-4 py-2.5 text-center font-semibold">${r.avg_real_days}</td>
                    <td class="px-4 py-2.5 text-center">${r.avg_target_days}</td>
                    <td class="px-4 py-2.5 text-center text-green-600">${r.ok}</td>
                    <td class="px-4 py-2.5 text-center text-red-600">${r.overdue}</td>
                    <td class="px-4 py-2.5 text-center font-bold ${pctColor}">${r.compliance_pct}%</td>
                </tr>`;
        }).join('');
    };

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    window.toggleBottleneckReport = () => {
        const container = document.getElementById('bottleneckReportContainer');
        if (!container) return;
        container.classList.toggle('hidden');
    };

    window.exportBottleneckReport = () => {
        const area = document.getElementById('slaAreaFilter')?.value || '';
        const start = document.getElementById('slaStartDate')?.value || '';
        const end = document.getElementById('slaEndDate')?.value || '';
        const params = new URLSearchParams();
        if (area) params.append('area_id', area);
        if (start) params.append('start_date', start);
        if (end) params.append('end_date', end);
        const qs = params.toString();
        window.location.href = '/recruitment/api/dashboard/bottleneck-report/export' + (qs ? `?${qs}` : '');
    };

    // Re-renderizar al redimensionar para mantener la proporción
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (lastBottleneckData) window.renderBottleneckChart(lastBottleneckData);
        }, 150);
    });
</script>
